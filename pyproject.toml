[tool.poetry]
name = "rag-manuals"
version = "0.1.0"
description = "Run a RAG system on two manuals"
authors = ["Ema Ilic <ema.ilic9@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
openai = "^1.65.4"
pypdf2 = "^3.0.1"
tqdm = "^4.67.1"
sentence-transformers = "^3.4.1"
python-dotenv = "^1.0.1"
pinecone = "^6.0.1"
pdfplumber = "^0.11.5"
pillow = "^11.1.0"
pytesseract = "^0.3.13"
pdf2image = "^1.17.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
